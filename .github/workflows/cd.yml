name: CD — Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Run CI only (skip deploy jobs)
        required: false
        default: false
        type: boolean
      run_migrations:
        description: Apply Supabase migrations to production DB
        required: false
        default: true
        type: boolean

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  migrate-production:
    name: Production — database migrations
    needs: [ci]
    if: >-
      ${{
        (github.event_name == 'push' || inputs.run_migrations) &&
        !inputs.skip_deploy &&
        vars.RUN_PRODUCTION_MIGRATIONS == 'true'
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DB_URL="${DATABASE_URL/postgresql+asyncpg/postgresql}"
          supabase db push --db-url "$DB_URL"

  publish-backend:
    name: Production — publish backend image
    needs: [ci]
    if: ${{ github.event_name == 'push' && !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend-webhook:
    name: Production — trigger backend redeploy
    needs: [publish-backend]
    if: >-
      ${{
        github.event_name == 'push' &&
        !inputs.skip_deploy &&
        vars.BACKEND_DEPLOY_WEBHOOK_URL != ''
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger hosting provider redeploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ vars.BACKEND_DEPLOY_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}"